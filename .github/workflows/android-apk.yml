name: Build SUPER PHONE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/first-run-redesign
    paths:
      - "SUPER_PHONE_starter/apps/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://eqlenftagozvjezswbaf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxbGVuZnRhZ296dmplenN3YmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MjE2MTcsImV4cCI6MjExMDQ5NzYxN30.NFu_2upJiysPpf8hAOWWD03CZP90eUgDAwuLM7t8kCM
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate
      - name: Install workspace dependencies
        working-directory: SUPER_PHONE_starter
        run: pnpm install --no-frozen-lockfile
      - name: Generate native Android project
        working-directory: SUPER_PHONE_starter/apps/mobile
        run: pnpm exec expo prebuild --platform android --non-interactive
      - name: Build APK
        working-directory: SUPER_PHONE_starter/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-PHONE-Android-APK
          path: SUPER_PHONE_starter/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
